<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>블록 월드</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: "Malgun Gothic", sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
      }
      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.8);
      }
      #crosshair::before {
        left: 8px;
        top: 0;
        width: 2px;
        height: 18px;
      }
      #crosshair::after {
        top: 8px;
        left: 0;
        height: 2px;
        width: 18px;
      }
      #fps {
        position: absolute;
        left: 12px;
        top: 8px;
        color: #fff;
        font-size: 13px;
        text-shadow: 0 1px 2px #000;
      }
      #joystick-base,
      #joystick-knob {
        position: absolute;
        border-radius: 50%;
        display: none;
      }
      #joystick-base {
        width: 120px;
        height: 120px;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.35);
      }
      #joystick-knob {
        width: 52px;
        height: 52px;
        background: rgba(255, 255, 255, 0.5);
      }
      #jump-button {
        position: absolute;
        right: 40px;
        bottom: 36px;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.5);
        color: #fff;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      #jump-button.active {
        background: rgba(255, 255, 255, 0.45);
      }
      #break-button,
      #place-button {
        position: absolute;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        color: #fff;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      #break-button {
        right: 40px;
        bottom: 124px;
        background: rgba(220, 70, 60, 0.4);
      }
      #place-button {
        right: 130px;
        bottom: 36px;
        background: rgba(70, 170, 90, 0.4);
      }
      #break-button.active,
      #place-button.active {
        filter: brightness(1.6);
      }
      #hotbar {
        position: absolute;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
      }
      .slot {
        width: 52px;
        height: 52px;
        box-sizing: border-box;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        color: #fff;
        font-size: 11px;
        text-shadow: 0 1px 2px #000;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 2px;
        pointer-events: auto;
      }
      .slot.selected {
        border-color: #fff;
        transform: scale(1.12);
      }
      #rotate-guide {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #eee;
        font-size: 20px;
        z-index: 100;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate-guide {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="crosshair"></div>
      <div id="fps"></div>
      <div id="joystick-base"></div>
      <div id="joystick-knob"></div>
      <div id="jump-button">점프</div>
      <div id="break-button">부수기</div>
      <div id="place-button">놓기</div>
      <div id="hotbar"></div>
    </div>
    <div id="rotate-guide">화면을 가로로 돌려주세요</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
